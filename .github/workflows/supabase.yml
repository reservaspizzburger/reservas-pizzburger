name: Supabase

# Aplica la base de datos (supabase/schema.sql) y publica la función de correos
# (supabase/functions/correo) cada vez que cambian.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        → cadena "Session pooler" de Supabase (con la contraseña)
#   CLAVE_CORREO           → clave compartida entre la base de datos y la función de correos
#   SUPABASE_ACCESS_TOKEN  → token personal de Supabase (Account → Access Tokens)
#   GMAIL_APP_PASSWORD     → contraseña de aplicación de reservaspizzburger@gmail.com

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: qmkrkqsnvlsjdfrdejxk
  GMAIL_USER: reservaspizzburger@gmail.com

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Aplicar base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql

      - name: Guardar clave de correos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          if [ -z "$CLAVE_CORREO" ]; then echo "::warning::Falta el secreto CLAVE_CORREO: no se enviarán correos."; exit 0; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v clave="$CLAVE_CORREO" <<'SQL'
          insert into pzb.secretos (clave, valor) values ('mailer_clave', :'clave')
          on conflict (clave) do update set valor = excluded.valor;
          SQL

      - name: Comprobar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Mesas: ' || count(*) from pzb.mesas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Reservas: ' || count(*) from pzb.reservas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Clientes: ' || count(*) from pzb.clientes"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Correos configurados: ' || case when exists (select 1 from pzb.secretos where clave = 'mailer_clave') then 'sí' else 'no' end"

  correos:
    runs-on: ubuntu-latest
    needs: base-de-datos
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          falta=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN." && falta=1
          [ -z "$GMAIL_APP_PASSWORD" ] && echo "::error::Falta el secreto GMAIL_APP_PASSWORD." && falta=1
          [ -z "$CLAVE_CORREO" ] && echo "::error::Falta el secreto CLAVE_CORREO." && falta=1
          exit $falta

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guardar secretos de la función
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            "CLAVE_CORREO=$CLAVE_CORREO" "GMAIL_USER=$GMAIL_USER" "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" > /dev/null
          echo "Secretos guardados"

      - name: Publicar función de correos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy correo --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Correo de prueba
        env:
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          body=$(jq -n --arg k "$CLAVE_CORREO" --arg e "$GMAIL_USER" \
            '{clave:$k, tipo:"prueba", reserva:{}, config:{nombre:"Pizzburger", emailRestaurante:$e}}')
          r=$(curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/correo" -H 'Content-Type: application/json' -d "$body")
          echo "Respuesta: $r"
          echo "$r" | jq -e '.ok == true' > /dev/null || { echo "::error::La función de correos no pudo enviar el correo de prueba."; exit 1; }
