name: Supabase

# Aplica la base de datos (supabase/schema.sql) y publica la función de correos
# (supabase/functions/correo) cada vez que cambian.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        → cadena "Session pooler" de Supabase (con la contraseña)
#   CLAVE_CORREO           → clave inventada, compartida entre la base de datos y la función de correos
#   SUPABASE_ACCESS_TOKEN  → token personal de Supabase (Account → Access Tokens)
#   GMAIL_APP_PASSWORD     → contraseña de aplicación de reservaspizzburger@gmail.com
# Sin los tres últimos la base de datos se actualiza igual, pero los correos quedan apagados.

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: qmkrkqsnvlsjdfrdejxk
  GMAIL_USER: reservaspizzburger@gmail.com

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Aplicar base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # En una sola transacción: si algo falla, no se aplica nada y la base queda como estaba
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/schema.sql

      - name: Guardar clave de correos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          if [ -z "$CLAVE_CORREO" ]; then echo "::warning::Falta el secreto CLAVE_CORREO: no se enviarán correos."; exit 0; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v clave="$CLAVE_CORREO" <<'SQL'
          insert into pzb.secretos (clave, valor) values ('mailer_clave', :'clave')
          on conflict (clave) do update set valor = excluded.valor;
          SQL

      - name: Comprobar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Mesas: ' || count(*) from pzb.mesas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Reservas: ' || count(*) from pzb.reservas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Clientes: ' || count(*) from pzb.clientes"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Clave de correos guardada: ' || case when exists (select 1 from pzb.secretos where clave = 'mailer_clave') then 'sí' else 'no' end"
          psql "$SUPABASE_DB_URL" -At -c "select 'Recordatorio automático (cada 15 min): ' || coalesce((select schedule from cron.job where jobname = 'pzb-recordatorios'), 'NO ACTIVO')" || true

  correos:
    runs-on: ubuntu-latest
    needs: base-de-datos
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        id: secretos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          faltan=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltan="$faltan SUPABASE_ACCESS_TOKEN"
          [ -z "$GMAIL_APP_PASSWORD" ] && faltan="$faltan GMAIL_APP_PASSWORD"
          [ -z "$CLAVE_CORREO" ] && faltan="$faltan CLAVE_CORREO"
          if [ -n "$faltan" ]; then
            echo "::warning::LOS CORREOS NO ESTÁN ACTIVOS. Faltan estos secretos en GitHub:$faltan"
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secretos.outputs.listo == 'si'
        with:
          version: latest

      - name: Guardar secretos de la función
        if: steps.secretos.outputs.listo == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLAVE_CORREO: ${{ secrets.CLAVE_CORREO }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            "CLAVE_CORREO=$CLAVE_CORREO" "GMAIL_USER=$GMAIL_USER" "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" > /dev/null
          echo "Secretos guardados"

      - name: Publicar función de correos
        if: steps.secretos.outputs.listo == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy correo --project-ref "$PROJECT_REF" --no-verify-jwt

      # Prueba el camino real que seguirá cada reserva: base de datos → pg_net → función → Gmail.
      # Envía un correo de prueba a reservaspizzburger@gmail.com en cada publicación.
      - name: Probar el envío de punta a punta
        if: steps.secretos.outputs.listo == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if ! command -v psql > /dev/null; then sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; fi
          base=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select coalesce(max(id), 0) from net._http_response")
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select pzb.panel_correo_prueba()"
          for i in $(seq 1 30); do
            fila=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' -c "select status_code, coalesce(content, error_msg, '') from net._http_response where id > $base order by id desc limit 1")
            [ -n "$fila" ] && break
            sleep 2
          done
          echo "Respuesta de la función de correos: ${fila:-ninguna tras 60 s}"
          case "$fila" in
            200*'"ok":true'*) echo "Correo de prueba enviado (a la dirección «Correo del restaurante» del panel)" ;;
            *) echo "::error::La función de correos no pudo enviar el correo de prueba (mira la respuesta de arriba)."; exit 1 ;;
          esac
