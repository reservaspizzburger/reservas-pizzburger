name: Supabase

# Aplica la base de datos (supabase/schema.sql) cada vez que cambia.
# Solo hace falta un secreto del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  → cadena "Session pooler" de Supabase (con la contraseña)

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Aplicar base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # En una sola transacción: si algo falla, no se aplica nada y la base queda como estaba
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/schema.sql

      - name: Comprobar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Mesas: ' || count(*) from pzb.mesas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Reservas: ' || count(*) from pzb.reservas"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'Clientes: ' || count(*) from pzb.clientes"
          # Aviso (no falla): que se haya retirado el recordatorio automático antiguo
          psql "$SUPABASE_DB_URL" -At -c "select 'Recordatorios antiguos por quitar: ' || count(*) from cron.job where jobname = 'pzb-recordatorios'" || true
